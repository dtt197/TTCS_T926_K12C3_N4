<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Loại Phòng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2 class="mb-4">Danh sách Loại Phòng</h2>

    <!-- Hiển thị thông báo thành công/thất bại -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <a href="/room-types/add" class="btn btn-primary mb-3">+ Thêm mới loại phòng</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Mã loại phòng</th>
                <th>Tên loại phòng</th>
                <th>Sức chứa chuẩn</th>
                <th>Sức chứa tối đa</th>
                <th>Số giường</th>
                <th>Mô tả</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="rt : ${roomTypes}">
                <td th:text="${rt.id}">1</td>
                <td th:text="${rt.code}">CODE01</td>
                <td th:text="${rt.name}">Phòng VIP</td>
                <td th:text="${rt.standardCapacity}">2</td>
                <td th:text="${rt.maxCapacity}">4</td>
                <td th:text="${rt.numberOfBeds}">2</td>
                <td th:text="${rt.description}">Mô tả ngắn gọn...</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
