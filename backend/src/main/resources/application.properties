spring.application.name=homestay

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/homestay_db
spring.datasource.username=homestay_app
spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Security Defaults
app.jwt.access-secret=${JWT_ACCESS_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:9876543210FEDCBA9876543210FEDCBA9876543210FEDCBA9876543210FEDCBA}
app.jwt.access-ttl=PT30M
app.jwt.refresh-ttl=P7D
app.jwt.refresh-cookie-name=refresh_token
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2.server.resource=TRACE
# Email (S1-02). Dev dùng Mailpit, xem thư tại http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:HomeStay <no-reply@homestay.local>}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.token-ttl=PT30M
app.password-reset.max-requests=3
app.password-reset.request-window=PT1H