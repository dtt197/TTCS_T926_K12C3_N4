spring.application.name=homestay

# Mặc định chạy với PostgreSQL (homestay_db). Muốn chạy nhanh bằng H2 trong bộ nhớ thì bật profile dev:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

# PostgreSQL
# Bắt buộc khai báo DB_PASSWORD; địa chỉ và tài khoản mặc định chỉ dùng cho máy cá nhân.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homestay_db}
spring.datasource.username=${DB_USERNAME:homestay_app}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Security Defaults
# Bắt buộc khai báo, không có giá trị mặc định.
app.jwt.access-secret=${JWT_ACCESS_SECRET}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.jwt.access-ttl=PT30M
app.jwt.refresh-ttl=P7D
app.jwt.refresh-cookie-name=refresh_token
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}

# Email
# Cấu hình gửi qua Gmail thật (port 587, STARTTLS).
# Để gửi bằng Mailpit test offline: đặt MAIL_HOST=localhost, MAIL_PORT=1025, MAIL_AUTH=false, MAIL_STARTTLS=false
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:abce98873@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ptlscuenhhvelbez}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:smtp.gmail.com}
app.mail.from=${MAIL_FROM:HomeStay Manager <abce98873@gmail.com>}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# S4-10: đường kiểm tra tình trạng /actuator/health (trạng thái sống + kết nối cơ sở dữ liệu)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# S4-10: chạy sau nginx, lấy đúng IP người dùng cho nhật ký truy cập
server.forward-headers-strategy=native

# S4-10: địa chỉ giao diện được phép gọi API (phân tách bằng dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}