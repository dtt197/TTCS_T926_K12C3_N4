spring.application.name=homestay

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homestay_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Thuy@190706}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Security Defaults
app.jwt.access-secret=${JWT_ACCESS_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}
app.jwt.access-ttl=PT30M
app.jwt.refresh-ttl=P7D
app.jwt.refresh-cookie-name=refresh_token
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2.server.resource=TRACE