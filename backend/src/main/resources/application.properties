spring.application.name=homestay

# Mặc định chạy với PostgreSQL (homestay_db). Muốn chạy nhanh bằng H2 trong bộ nhớ thì bật profile dev:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

# PostgreSQL
# Bắt buộc khai báo DB_PASSWORD; địa chỉ và tài khoản mặc định chỉ dùng cho máy cá nhân.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homestay_db}
spring.datasource.username=${DB_USERNAME:homestay_app}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Security Defaults
# Bắt buộc khai báo, không có giá trị mặc định.
app.jwt.access-secret=${JWT_ACCESS_SECRET}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.jwt.access-ttl=PT30M
app.jwt.refresh-ttl=P7D
app.jwt.refresh-cookie-name=refresh_token
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}

# Email
# Mặc định gửi vào hộp thư giả ở localhost:1025 (Mailpit/Mailtrap): không đăng nhập, không mã hoá, không gửi thư thật.
# Gửi thư thật qua Gmail (staging) thì đặt bằng biến môi trường, KHÔNG ghi vào tệp này (S4-10: không có mật khẩu trong mã nguồn):
#   MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME, MAIL_PASSWORD (mật khẩu ứng dụng), MAIL_AUTH=true, MAIL_STARTTLS=true, MAIL_FROM
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:}
# Máy chủ thư chậm hoặc bị chặn thì bỏ sau 5 giây, không làm treo thao tác đặt/xác nhận booking (lỗi được ghi vào nhật ký gửi thư)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:HomeStay <no-reply@homestay.local>}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# S4-10: đường kiểm tra tình trạng /actuator/health (trạng thái sống + kết nối cơ sở dữ liệu)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# S4-10: chạy sau nginx, lấy đúng IP người dùng cho nhật ký truy cập
server.forward-headers-strategy=native

# S4-10: địa chỉ giao diện được phép gọi API (phân tách bằng dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# S4-09: chế độ demo cho staging trước nghiệm thu (tài khoản mẫu + nạp lại dữ liệu mẫu).
# Mặc định tắt (máy cá nhân, hệ thống bàn giao); staging bật bằng DEMO_MODE=true trong .env.
app.demo-mode=${DEMO_MODE:false}
