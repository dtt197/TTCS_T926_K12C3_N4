spring.datasource.url=jdbc:h2:mem:homestay_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.access-secret=test-access-secret-test-access-secret-test-access-secret
app.jwt.refresh-secret=test-refresh-secret-test-refresh-secret-test-refresh-secret
app.jwt.access-ttl=PT30M
app.jwt.refresh-ttl=P7D
app.jwt.refresh-cookie-name=refresh_token
app.jwt.refresh-cookie-secure=false
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=HomeStay <no-reply@homestay.local>
app.frontend-url=http://localhost:5173